version: "3.8"
# ============================================================
# AgentMailbox — On-Prem Stack
#
# Deploy the entire pipeline inside a bank's data center.
# No cloud APIs. No data leaves the network.
# Requires: NVIDIA GPU (A100/H100 for MLA, or T4/L4 for Qwen)
#
# Usage:
#   docker compose -f docker-compose.onprem.yml up -d
#   curl https://localhost/health
# ============================================================

services:
  # ── Inference Engine (vLLM) ─────────────────────────────
  # Runs self-hosted LLM with prefix caching.
  # Pick your model based on GPU:
  #   T4 (16GB):  Qwen/Qwen2.5-3B-Instruct
  #   L4 (24GB):  Qwen/Qwen2.5-7B-Instruct
  #   A100 (40GB): deepseek-ai/DeepSeek-V2-Lite-Chat (real MLA)
  #   A100 (80GB): deepseek-ai/DeepSeek-V3 (full MLA, 671B MoE)
  inference:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      - HF_HOME=/models
    volumes:
      - model-cache:/models
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      --enable-prefix-caching
      --max-model-len ${MAX_MODEL_LEN:-4096}
      --gpu-memory-utilization ${GPU_MEM_UTIL:-0.85}
      --dtype float16
      --enforce-eager
      --host 0.0.0.0
      --port 8000
      --api-key ${VLLM_API_KEY:?VLLM_API_KEY is required}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── Embedding Engine ────────────────────────────────────
  # Sentence-transformers for vector embeddings.
  # Runs on CPU or GPU.
  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=${EMBED_GPU:-0}
    volumes:
      - model-cache:/models
    command: >
      --model-id ${EMBED_MODEL:-BAAI/bge-large-en-v1.5}
      --port 80
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Neo4j Graph Database ────────────────────────────────
  # Stores program call graphs, impact analysis edges,
  # and training data relationships.
  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=${NEO4J_USER:?NEO4J_USER is required}/${NEO4J_PASS:?NEO4J_PASS is required}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=${NEO4J_HEAP:-2G}
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── MinIO (BYOS S3-Compatible Storage) ──────────────────
  # Stores vectors, KV cache snapshots, audit trails.
  # S3-compatible API — swap with any S3 provider.
  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── AgentMailbox MCP Server ─────────────────────────────
  # The main application: parsers + RAPTOR + tools + API.
  agentmailbox:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - AGENTSMCP_DB=postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      - AGENTSMCP_API_KEY=${AGENTSMCP_API_KEY:?AGENTSMCP_API_KEY is required}
      # Inference — points to local vLLM container
      - AGENTSMCP_VLLM_URL=http://inference:8000
      - AGENTSMCP_VLLM_API_KEY=${VLLM_API_KEY:?VLLM_API_KEY is required}
      - AGENTSMCP_MODAL_EMBED_URL=http://embedder:80
      # Graph
      - AGENTSMCP_NEO4J_URI=bolt://neo4j:7687
      - AGENTSMCP_NEO4J_USER=${NEO4J_USER:?NEO4J_USER is required}
      - AGENTSMCP_NEO4J_PASS=${NEO4J_PASS:?NEO4J_PASS is required}
      # Storage
      - AGENTSMCP_S3_ENDPOINT=http://minio:9000
      - AGENTSMCP_S3_BUCKET=${S3_BUCKET:?S3_BUCKET is required}
      - AGENTSMCP_S3_ACCESS_KEY=${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      - AGENTSMCP_S3_SECRET_KEY=${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      # Trajectory
      - AGENTSMCP_LOG_DIR=/data/trajectory
      - AGENTSMCP_SESSION_ID=${SESSION_ID:-onprem}
      # No external API calls
      - AGENTSMCP_OFFLINE=true
    volumes:
      - trajectory-data:/data/trajectory
    expose:
      - "3000"
    depends_on:
      inference:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      agentmailbox:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/agentsmcp.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:?TLS_CERT_PATH is required}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?TLS_KEY_PATH is required}:/etc/nginx/tls/privkey.pem:ro

volumes:
  postgres-data:
  model-cache:
  neo4j-data:
  neo4j-logs:
  minio-data:
  trajectory-data:
