services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:?NEO4J_USER is required}/${NEO4J_PASS:?NEO4J_PASS is required}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [backend]

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    command: server /data
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [backend]

  agentmailbox:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      AGENTSMCP_DB: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      AGENTSMCP_API_KEY: ${AGENTSMCP_API_KEY:?AGENTSMCP_API_KEY is required}
      AGENTSMCP_MODAL_ENDPOINT_URL: ${AGENTSMCP_MODAL_ENDPOINT_URL:?AGENTSMCP_MODAL_ENDPOINT_URL is required}
      AGENTSMCP_MODAL_EMBED_URL: ${AGENTSMCP_MODAL_EMBED_URL:?AGENTSMCP_MODAL_EMBED_URL is required}
      AGENTSMCP_MODEL: ${AGENTSMCP_MODEL:?AGENTSMCP_MODEL is required}
      AGENTSMCP_NEO4J_URI: bolt://neo4j:7687
      AGENTSMCP_NEO4J_USER: ${NEO4J_USER:?NEO4J_USER is required}
      AGENTSMCP_NEO4J_PASS: ${NEO4J_PASS:?NEO4J_PASS is required}
      AGENTSMCP_S3_ENDPOINT: http://minio:9000
      AGENTSMCP_S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      AGENTSMCP_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      AGENTSMCP_S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose: ["3000"]
    networks: [backend, frontend]

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      agentmailbox:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../docker/nginx/agentsmcp.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:?TLS_CERT_PATH is required}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?TLS_KEY_PATH is required}:/etc/nginx/tls/privkey.pem:ro
    networks: [frontend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres-data:
  neo4j-data:
  minio-data:
